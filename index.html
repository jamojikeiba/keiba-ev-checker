<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競馬期待値チェッカー</title><link rel="stylesheet" href="style.css"></head><body><main><h1>競馬期待値チェッカー</h1><p class="sub">推定勝率と現在の単勝オッズを入力してください。予測データはブラウザ内に保存されます。</p><section class="selectors"><label>開催日<select id="date"></select></label><label>競馬場<select id="venue"></select></label><label>レース<select id="race"></select></label></section><p id="status"></p><div class="scroll"><table><thead><tr><th>枠</th><th>馬番</th><th>馬名</th><th>推定勝率 %</th><th>損益分岐オッズ</th><th>現在オッズ</th><th>期待回収率</th></tr></thead><tbody id="horses"></tbody></table></div><p id="total"></p><p class="actions"><button id="csv">入力結果をCSV保存</button><button id="clear" class="secondary">このレースの入力を消去</button></p><p class="note">期待回収率 = 推定勝率(%) × 単勝オッズ(倍)。100%超は利益保証ではありません。オッズ変動・推定誤差に注意してください。<br>本ツールは入力された勝率を評価するもので、勝率を推定しません。</p></main><script src="app.js"></script></body></html>
